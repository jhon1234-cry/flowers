<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flores para Ti</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #ffe6f2;
            text-align: center;
            font-family: Arial, sans-serif;
        }
        
        .flower-container {
            opacity: 0;
            transform: scale(0.5);
            transition: opacity 2s ease-in-out, transform 1.5s ease-in-out;
        }

        .flower-container.show {
            opacity: 1;
            transform: scale(1);
        }

        img {
            width: 200px;
            height: auto;
        }

        .message {
            font-size: 20px;
            color: #d63384;
            margin-top: 20px;
            opacity: 0;
            transition: opacity 3s ease-in-out;
        }

        .message.show {
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="flower-container" id="flower">
        <img src="img/flowers.png" alt="Flores">
        <div class="message" id="message">
            Estas flores representan la alegría que me das cada día.  
            Siempre le agradezco a Dios por haberte puesto en mi camino.  
            Eres lo más bonito que me pudo haber pasado.
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            setTimeout(() => {
                document.getElementById("flower").classList.add("show");
                setTimeout(() => {
                    document.getElementById("message").classList.add("show");
                }, 2000); 
            }, 1000);
        });
    </script>

</body>
            </html>
